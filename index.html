<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙 AI 語音/打字提醒助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-4">
    <h1 class="text-2xl font-bold text-blue-400">🤖 雙 AI 語音/打字提醒助手</h1>
    
    <!-- Gemini Key -->
    <div class="text-left bg-slate-700/50 p-2.5 rounded-lg">
      <label class="text-xs text-slate-300 font-semibold">Gemini API Key：</label>
      <input type="password" id="apiKeyInput" placeholder="貼上 Gemini Key (AIza...)" class="w-full bg-slate-800 text-xs px-2.5 py-1.5 rounded border border-slate-600 focus:outline-none">
    </div>

    <!-- Groq Key (備援) -->
    <div class="text-left bg-slate-700/50 p-2.5 rounded-lg border border-blue-500/30">
      <label class="text-xs text-blue-300 font-semibold">⚡ Groq 備援 API Key (防塞車首選)：</label>
      <input type="password" id="groqKeyInput" placeholder="貼上 Groq Key (gsk_...)" class="w-full bg-slate-800 text-xs px-2.5 py-1.5 rounded border border-slate-600 focus:outline-none">
    </div>

    <!-- 記憶 API Key 狀態提示 -->
    <div class="flex justify-between items-center text-xs px-1">
      <span id="saveStatus" class="text-slate-400">已啟用瀏覽器自動記憶</span>
      <button id="clearKeysBtn" class="text-slate-400 hover:text-red-400 underline transition">清除記憶的金鑰</button>
    </div>

    <!-- 提醒內容與麥克風按鈕 -->
    <div class="text-left space-y-2 pt-2 border-t border-slate-700">
      <label class="text-xs text-slate-300 font-semibold">提醒內容或點擊麥克風：</label>
      <div class="flex gap-2">
        <input type="text" id="textInput" placeholder="例：提醒我 10 分鐘後去洗衣服" class="flex-1 bg-slate-700 text-sm px-3 py-2 rounded border border-slate-600">
        <button id="sendBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition">傳送</button>
      </div>

      <!-- 麥克風大按鈕 -->
      <div class="flex flex-col items-center justify-center pt-2">
        <button id="micBtn" class="w-16 h-16 bg-blue-600 hover:bg-blue-500 active:scale-95 rounded-full flex items-center justify-center shadow-lg transition duration-200">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 013-3k3 0 013 3v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>
        <span id="micStatus" class="text-xs text-slate-400 mt-2">點擊麥克風開始說話</span>
      </div>
    </div>

    <!-- 結果顯示區 -->
    <div id="status" class="text-sm text-slate-300 min-h-[80px] flex items-center justify-center bg-slate-700/50 rounded-lg p-3 whitespace-pre-wrap text-left">
      請輸入內容或按麥克風說話...
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const groqKeyInput = document.getElementById('groqKeyInput');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');
    const micStatus = document.getElementById('micStatus');
    const status = document.getElementById('status');
    const saveStatus = document.getElementById('saveStatus');
    const clearKeysBtn = document.getElementById('clearKeysBtn');

    // 指向你的 Cloudflare Worker 後端網址
    const WORKER_URL = 'https://orange-paper-9d12.a0423956310.workers.dev/';

    // 🔑 1. 頁面載入時，自動從瀏覽器讀取舊有的 API Keys
    window.addEventListener('DOMContentLoaded', () => {
      const savedGeminiKey = localStorage.getItem('gemini_api_key');
      const savedGroqKey = localStorage.getItem('groq_api_key');

      if (savedGeminiKey) apiKeyInput.value = savedGeminiKey;
      if (savedGroqKey) groqKeyInput.value = savedGroqKey;

      if (savedGeminiKey || savedGroqKey) {
        saveStatus.innerText = '✅ 已自動載入已儲存的金鑰';
        saveStatus.classList.replace('text-slate-400', 'text-green-400');
      }
    });

    // 🔑 2. 當 Key 內容改變時，自動更新並儲存到瀏覽器
    function autoSaveKeys() {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
      localStorage.setItem('groq_api_key', groqKeyInput.value.trim());
      saveStatus.innerText = '✅ 金鑰已自動記憶';
      saveStatus.classList.replace('text-slate-400', 'text-green-400');
    }

    apiKeyInput.addEventListener('input', autoSaveKeys);
    groqKeyInput.addEventListener('input', autoSaveKeys);

    // 🔑 3. 清除記憶的金鑰按鈕
    clearKeysBtn.addEventListener('click', () => {
      localStorage.removeItem('gemini_api_key');
      localStorage.removeItem('groq_api_key');
      apiKeyInput.value = '';
      groqKeyInput.value = '';
      saveStatus.innerText = '🗑️ 已清除記憶的金鑰';
      saveStatus.classList.replace('text-green-400', 'text-slate-400');
    });

    async function analyzePrompt(userText) {
      status.innerText = `🗣️ 分析內容：${userText}\n🤖 正在調用 AI 分析並發送 LINE 通知...`;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: userText,
            apiKey: apiKeyInput.value.trim(),
            groqKey: groqKeyInput.value.trim()
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resultText = data.candidates[0].content.parts[0].text;
          status.innerText = `✅ AI 解析成功：\n\n${resultText}`;
        } else if (data.error) {
          status.innerText = `❌ ${data.error}`;
        }
      } catch (err) {
        status.innerText = "❌ 連線失敗，請檢查網路。";
      }
    }

    sendBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (text) analyzePrompt(text);
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    // 🎙️ 語音辨識邏輯 (跨平台相容 Safari / Chrome / iOS / Android)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.continuous = false;
      recognition.interimResults = false;

      let isListening = false;

      micBtn.addEventListener('click', () => {
        if (!isListening) {
          try {
            recognition.start();
          } catch (e) {
            recognition.stop();
          }
        } else {
          recognition.stop();
        }
      });

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.remove('bg-blue-600', 'hover:bg-blue-500');
        micBtn.classList.add('bg-red-600', 'animate-pulse');
        micStatus.innerText = '🎙️ 正在聆聽中，請說話...';
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('bg-red-600', 'animate-pulse');
        micBtn.classList.add('bg-blue-600', 'hover:bg-blue-500');
        micStatus.innerText = '點擊麥克風開始說話';
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        textInput.value = transcript;
        micStatus.innerText = `辨識成功：「${transcript}」`;
        analyzePrompt(transcript);
      };

      recognition.onerror = (event) => {
        micStatus.innerText = `語音辨識提示：${event.error} (請確保開啟麥克風權限)`;
      };
    } else {
      micStatus.innerText = '此瀏覽器不支援語音辨識，請使用 Chrome 或 Safari 開啟。';
    }
  </script>
</body>
</html>
