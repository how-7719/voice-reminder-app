<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 提醒助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-6 shadow-xl text-center space-y-6">
    <h1 class="text-2xl font-bold text-blue-400">🤖 AI 語音/打字提醒助手</h1>
    
    <!-- API Key 輸入區 -->
    <div class="text-left bg-slate-700/50 p-3 rounded-lg space-y-2">
      <label class="text-xs text-slate-300 font-semibold">Google Gemini API Key：</label>
      <input type="password" id="apiKeyInput" placeholder="貼上你的 API Key (AIza...)" class="w-full bg-slate-800 text-sm px-3 py-2 rounded border border-slate-600 focus:outline-none focus:border-blue-500">
    </div>

    <!-- 提醒內容輸入區 -->
    <div class="text-left space-y-2">
      <label class="text-xs text-slate-300 font-semibold">輸入提醒內容：</label>
      <div class="flex gap-2">
        <input type="text" id="textInput" placeholder="例：提醒我 10 分鐘後去倒垃圾" class="flex-1 bg-slate-700 text-sm px-3 py-2 rounded border border-slate-600 focus:outline-none focus:border-blue-500">
        <button id="sendBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold transition">傳送</button>
      </div>
    </div>

    <!-- 結果顯示區 -->
    <div id="status" class="text-sm text-slate-300 min-h-[80px] flex items-center justify-center bg-slate-700/50 rounded-lg p-3 whitespace-pre-wrap text-left">
      請貼上 API Key，並輸入提醒內容按下傳送...
    </div>
  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKeyInput');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    // 已串接你剛剛建立的 Cloudflare Worker 後端網址
    const WORKER_URL = 'https://orange-paper-9d12.a0423956310.workers.dev/';

    async function analyzePrompt(userText) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("請先貼上你的 Gemini API Key！");
        return;
      }

      status.innerText = `🗣️ 分析內容：${userText}\n🤖 正在透過雲端 AI 分析中...`;

      try {
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text: userText,
            apiKey: apiKey
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const resultText = data.candidates[0].content.parts[0].text;
          status.innerText = `✅ AI 解析成功：\n\n${resultText}`;
        } else if (data.error) {
          status.innerText = `❌ API 回應錯誤：${data.error}`;
        } else {
          status.innerText = "❌ 解析失敗，請確認 API Key 是否填寫正確。";
        }
      } catch (err) {
        status.innerText = "❌ 連線至雲端服務失敗，請稍後再試。";
        console.error(err);
      }
    }

    sendBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (text) analyzePrompt(text);
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
